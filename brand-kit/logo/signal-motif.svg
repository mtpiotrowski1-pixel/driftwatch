<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 900"
  preserveAspectRatio="xMidYMid slice"
  aria-hidden="true"
  focusable="false"
>
  <style>
    .dw-motif-grid {
      fill: var(--dw-signal-grid, var(--color-line, #d8ded5));
    }

    .dw-motif-line {
      fill: none;
      stroke: var(--dw-signal-line, var(--color-mist-100, #151915));
      vector-effect: non-scaling-stroke;
    }

    .dw-motif-brand {
      fill: var(--dw-signal-brand, var(--color-brand-500, #b4e653));
    }

    .dw-motif-brand-line {
      fill: none;
      stroke: var(--dw-signal-brand, var(--color-brand-500, #b4e653));
      vector-effect: non-scaling-stroke;
    }

    .dw-motif-accent {
      fill: var(--dw-signal-accent, var(--color-accent-soft, #36b8ad));
    }

    .dw-motif-accent-line {
      fill: none;
      stroke: var(--dw-signal-accent, var(--color-accent-soft, #36b8ad));
      vector-effect: non-scaling-stroke;
    }
  </style>

  <defs>
    <pattern
      id="driftwatch-signal-dot-grid"
      x="0"
      y="0"
      width="72"
      height="72"
      patternUnits="userSpaceOnUse"
    >
      <circle class="dw-motif-grid" cx="2" cy="2" r="1.6" />
    </pattern>
    <clipPath id="driftwatch-signal-frame">
      <rect width="1440" height="900" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#driftwatch-signal-frame)">
    <rect width="1440" height="900" fill="url(#driftwatch-signal-dot-grid)" opacity=".56" />

    <circle class="dw-motif-brand" cx="1120" cy="212" r="238" opacity=".045" />
    <circle class="dw-motif-accent" cx="242" cy="724" r="176" opacity=".04" />

    <path
      class="dw-motif-accent"
      d="M744-36 590 356h34L500 936l214-424h-38z"
      opacity=".055"
    />

    <g opacity=".22">
      <path class="dw-motif-line" d="M88 242H1352" stroke-width="1.25" />
      <path
        class="dw-motif-line"
        d="M88 270H418M466 270H716M760 270H1042M1090 270H1352"
        stroke-width="1"
        stroke-linecap="round"
        stroke-dasharray="2 12"
      />
      <circle class="dw-motif-line" cx="88" cy="242" r="5" stroke-width="1.25" />
      <circle class="dw-motif-line" cx="1352" cy="242" r="5" stroke-width="1.25" />
    </g>

    <g opacity=".14">
      <path
        class="dw-motif-brand-line"
        d="M84 642H398L584 350"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        class="dw-motif-brand-line"
        d="M654 388 796 642H1356"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        class="dw-motif-accent-line"
        d="M84 538H452L590 318"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        class="dw-motif-accent-line"
        d="M642 350 768 538H1356"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <g>
      <path
        class="dw-motif-brand-line"
        d="M84 590H426L600 315"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity=".74"
      />
      <path
        class="dw-motif-brand-line"
        d="M628 343 782 590H1356"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity=".74"
      />
      <circle class="dw-motif-brand" cx="600" cy="315" r="6" opacity=".92" />
      <circle class="dw-motif-accent" cx="628" cy="343" r="5" opacity=".9" />
      <path
        class="dw-motif-accent-line"
        d="M608 329 619 339"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-dasharray="1 6"
        opacity=".72"
      />
    </g>

    <g opacity=".3">
      <path class="dw-motif-line" d="M118 738H332" stroke-width="1" />
      <path class="dw-motif-line" d="M1108 124H1322" stroke-width="1" />
      <circle class="dw-motif-brand" cx="118" cy="738" r="4" />
      <circle class="dw-motif-accent" cx="1322" cy="124" r="4" />
    </g>
  </g>
</svg>
