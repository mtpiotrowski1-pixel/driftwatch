# Railway deployment config. Build from the Dockerfile and run a single instance:
# the monitoring scheduler has no cross-instance coordination, so more than one
# replica would check every site (and email about it) multiple times.

[build]
builder = "DOCKERFILE"

[deploy]
preDeployCommand = ["driftwatch migrate"]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
