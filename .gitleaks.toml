title = "Driftwatch secret scanning"

[extend]
useDefault = true

# Values are fixed synthetic test material, constrained to the two original
# fixture files. This does not exempt arbitrary tests, providers or config files.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic test session key and RFC6238 public test vector"
condition = "AND"
paths = ['''^tests/(conftest|test_two_factor)\.py$''']
regexTarget = "secret"
regexes = [
  '''^test-secret-key-0123456789-abcdef$''',
  '''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''',
]

# Reviewed exact fixtures. These values are used only in isolated tests or CI.
# Both the path AND full value must match; new credentials in these files still fail.
# Target the rule: the dir walker skips global allowlist paths before evaluating
# their content predicates, even with AND. Rule allowlists retain both checks.

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Exact synthetic fixture values"
condition = "AND"
paths = ['''^\.github/workflows/ci\.yml$''']
regexTarget = "secret"
regexes = [
  '''^ci\-encryption\-key\-0123456789\-abcdef$''',
]

[[allowlists]]
targetRules = ["generic-api-key", "stripe-access-token"]
description = "Exact synthetic fixture values"
condition = "AND"
paths = ['''^tests/test_billing_api\.py$''']
regexTarget = "secret"
regexes = [
  '''^sk_test_1234567890$''',
  '''^test\-secret\-key\-0123456789\-abcdef$''',
  '''^whsec_1234567890$''',
]

