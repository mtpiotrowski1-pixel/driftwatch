# Assign this config file to the private capture-worker Railway service. It has
# no migration command and probes the worker-specific liveness endpoint.

[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/livez"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
